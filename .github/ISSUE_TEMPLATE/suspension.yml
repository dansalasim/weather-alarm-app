name: Class/work suspension
description: Post (or lift) a class or work suspension. The app shows it to users in that city within about a minute.
title: "[Suspension] "
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Announce a suspension
        - Lift (cancel) a suspension
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: City
      options:
        - City of Isabela (Basilan)
        - Zamboanga City
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: When
      options:
        - Today
        - Tomorrow
        - Other date (type it below)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Other date
      description: Only if you chose "Other date". Format YYYY-MM-DD, e.g. 2026-11-05
  - type: dropdown
    id: what
    attributes:
      label: Suspended
      options:
        - Classes
        - Work
        - Classes and work
    validations:
      required: true
  - type: checkboxes
    id: levels
    attributes:
      label: Levels (for classes)
      options:
        - label: All levels
        - label: Preschool
        - label: Elementary
        - label: High school
        - label: College
  - type: dropdown
    id: sector
    attributes:
      label: Public or private
      options:
        - Public and private
        - Public only
        - Private only
    validations:
      required: true
  - type: dropdown
    id: period
    attributes:
      label: Hours
      options:
        - Whole day
        - Morning only
        - Afternoon only
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Who announced it
      placeholder: City Government of Isabela
  - type: input
    id: url
    attributes:
      label: Link to the announcement
      placeholder: https://www.facebook.com/isabelacity.gov/posts/...
  - type: textarea
    id: details
    attributes:
      label: Details (optional)
      description: One or two sentences, e.g. the reason
