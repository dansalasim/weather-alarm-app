name: Build place list (coordinates)

# Runs when the PSGC list or the lookup script changes. Writes ph-places.json and a
# report to the 'data' branch; the app copy lives in app/src/main/assets.
on:
  push:
    branches: [ main ]
    paths:
      - data-src/ph-lgus.json
      - .github/scripts/geocode_places.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - name: Look up coordinates
        run: python3 main/.github/scripts/geocode_places.py main/data-src/ph-lgus.json

      - name: Publish to the data branch
        run: |
          mkdir out && cp ph-places.json ph-places-report.json out/
          cd out
          git init -q -b data
          git config user.name "Place list builder"
          git config user.email "noreply@github.com"
          git add . && git commit -qm "Place list from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
