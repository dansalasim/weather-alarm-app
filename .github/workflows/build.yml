name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run forecast engine checks
        run: ./gradlew :core:checks --stacktrace

      - name: Build test APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-alarm-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Google Play upload bundle (.aab), signed with the upload key.
      # Runs only when the UPLOAD_KEY_PASSWORD secret has been added to the repository.
      - name: Build Play Store bundle
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        if: env.UPLOAD_KEY_PASSWORD != ''
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload bundle
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        if: env.UPLOAD_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: weather-alarm-ph-playstore-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
