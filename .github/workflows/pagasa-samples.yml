name: PAGASA samples (dev)

# Manual: downloads PAGASA's forecast page, PDFs and iHeatMAP responses so the
# app's on-phone readers can be built and tested against real files.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir s && cd s
          UA="Mozilla/5.0 (Linux; Android 14) WeatherAlarmPH/0.2"
          get() { curl -sSL -A "$UA" --max-time 60 -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          get minprsd.html https://www.pagasa.dost.gov.ph/regional-forecast/minprsd
          for r in ncrprsd nlprsd slprsd visprsd; do get $r.html https://www.pagasa.dost.gov.ph/regional-forecast/$r; done
          get weather.html https://www.pagasa.dost.gov.ph/weather
          get tc.html https://www.pagasa.dost.gov.ph/tropical-cyclone/severe-weather-bulletin
          for f in *.html; do
            grep -oE 'https?://[^"'"'"' ]+\.pdf[^"'"'"' ]*' "$f" | sort -u | sed "s|^|$f |" >> pdf-links.txt || true
          done
          cat pdf-links.txt
          i=0; while read src url; do i=$((i+1)); get "${src%.html}-$i.pdf" "$url"; done < pdf-links.txt
          get hi-current-date.json https://iheatmap.pagasa.dost.gov.ph/internal/api/current-date
          D=$(python3 -c "import json;print(json.load(open('hi-current-date.json'))['latest_issuance_date'])" || echo "")
          get hi-pixel.json "https://iheatmap.pagasa.dost.gov.ph/internal/api/pixel?lat=6.7032&long=121.9838&issuance_date=$D"
          get hi-max.json "https://iheatmap.pagasa.dost.gov.ph/internal/api/pixel/max?lat=6.7032&long=121.9838&issuance_date=$D"
          get hi-pixel-manila.json "https://iheatmap.pagasa.dost.gov.ph/internal/api/pixel?lat=14.5995&long=120.9842&issuance_date=$D"
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          for p in *.pdf; do pdftotext -layout "$p" "${p%.pdf}.txt" || true; done
          ls -la
      - name: Publish to the samples branch
        run: |
          cd s && git init -q -b samples
          git config user.name "Samples" && git config user.email "noreply@github.com"
          git add . && git commit -qm "PAGASA samples $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" samples
