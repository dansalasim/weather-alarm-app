name: PAGASA samples (dev)

# Manual: downloads PAGASA's forecast page, PDFs and iHeatMAP responses so the
# app's on-phone readers can be built and tested against real files.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir s && cd s
          UA="Mozilla/5.0 (Linux; Android 14) WeatherAlarmPH/0.2"
          J=cookies.txt
          get() { curl -sSL -A "$UA" -b $J -c $J --max-time 60 -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          post() { curl -sSL -A "$UA" -b $J -c $J --max-time 60 -X POST -d "" -H "Accept: application/json, text/javascript, */*; q=0.01" -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" -H "Origin: https://pagasa.dost.gov.ph" -H "X-Requested-With: XMLHttpRequest" -H "Referer: $3" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          B=https://pagasa.dost.gov.ph
          get minprsd.html $B/regional-forecast/minprsd
          post api-min-isabela.json $B/api/regional/Mindanao/990100000 $B/regional-forecast/minprsd
          post api-min-zambo.json $B/api/regional/Mindanao/97300000 $B/regional-forecast/minprsd
          post api-min-basilan-guess.json $B/api/regional/Mindanao/1500700000 $B/regional-forecast/minprsd
          get ncrprsd.html $B/regional-forecast/ncrprsd
          CODE=$(grep -oE "value='[0-9]+'" ncrprsd.html | head -1 | grep -oE "[0-9]+")
          post api-ncr-first.json $B/api/regional/NationalCapitalRegion/$CODE $B/regional-forecast/ncrprsd
          get visprsd.html $B/regional-forecast/visprsd
          CODE=$(grep -oE "value='[0-9]+'" visprsd.html | head -1 | grep -oE "[0-9]+")
          post api-vis-first.json $B/api/regional/Visayas/$CODE $B/regional-forecast/visprsd
          # Without a session cookie, as a phone app would call it
          curl -sSL -A "$UA" --max-time 60 -X POST -d "" -o api-min-isabela-nocookie.json -w "nocookie %{http_code} %{size_download}\n" $B/api/regional/Mindanao/990100000 || true
          curl -sSL -A "$UA" --max-time 60 -o api-min-isabela-get.json -w "get %{http_code} %{size_download}\n" $B/api/regional/Mindanao/990100000 || true
          for f in api-*.json; do echo "== $f"; head -c 3000 "$f"; echo; done
      - name: Publish to the samples branch
        run: |
          cd s && git init -q -b samples
          git config user.name "Samples" && git config user.email "noreply@github.com"
          git add . && git commit -qm "PAGASA samples $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" samples
